name: Validate pet

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/validate_pet.py
      - run: python scripts/generate_previews.py
      - run: git diff --exit-code -- assets/previews
